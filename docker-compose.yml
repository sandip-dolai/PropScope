services:
  db:
    image: postgis/postgis:16-3.4
    container_name: propscope_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propscope_db}
      POSTGRES_USER: ${POSTGRES_USER:-propscope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propscope_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propscope_user} -d ${POSTGRES_DB:-propscope_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propscope_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: propscope_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
