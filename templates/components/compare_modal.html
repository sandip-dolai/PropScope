<!-- Compare Properties Modal -->
<div id="compareModalBackdrop" class="fixed inset-0 z-[3000] bg-slate-950/60 backdrop-blur-sm hidden transition-opacity"></div>

<div id="compareModal" class="fixed inset-0 z-[3001] hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <!-- Center modal vertically -->
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
        
        <div class="relative inline-block align-bottom bg-white dark:bg-slate-900 rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-6xl w-full border border-slate-200 dark:border-slate-800">
            
            <!-- Header -->
            <div class="px-6 py-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-950/50">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-500 flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    </div>
                    <div>
                        <h3 class="text-lg font-black text-slate-900 dark:text-white" id="modal-title">Property Comparison Matrix</h3>
                        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">Comparing <span id="compareCountLabel"></span> saved assets</p>
                    </div>
                </div>
                <button type="button" id="closeCompareModalBtn" class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 dark:hover:text-slate-300 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Loading State -->
            <div id="compareLoadingState" class="py-24 text-center hidden">
                <div class="inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-sm font-bold text-slate-500">Aggregating location metrics & scoring...</p>
            </div>

            <!-- Error State -->
            <div id="compareErrorState" class="py-24 text-center hidden">
                <div class="w-12 h-12 rounded-2xl bg-rose-50 dark:bg-rose-500/10 text-rose-500 flex items-center justify-center mx-auto mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                </div>
                <h4 class="text-sm font-bold text-slate-900 dark:text-white mb-1">Comparison Failed</h4>
                <p id="compareErrorText" class="text-xs text-slate-500 max-w-sm mx-auto">Could not fetch properties.</p>
            </div>

            <!-- Comparison Table Container -->
            <div id="compareContentWrapper" class="p-6 overflow-x-auto">
                <table class="w-full text-left border-collapse" style="min-w: 800px;">
                    <thead>
                        <tr id="compareTableRowHeaders">
                            <!-- Injected dynamically: first col is empty, then property cards -->
                        </tr>
                    </thead>
                    <tbody id="compareTableBody" class="divide-y divide-slate-100 dark:divide-slate-800">
                        <!-- Injected dynamically -->
                    </tbody>
                </table>
            </div>
            
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('compareModal');
        const backdrop = document.getElementById('compareModalBackdrop');
        const closeBtn = document.getElementById('closeCompareModalBtn');
        const loadingState = document.getElementById('compareLoadingState');
        const errorState = document.getElementById('compareErrorState');
        const contentWrapper = document.getElementById('compareContentWrapper');
        
        window.openCompareModal = function(propertyIds) {
            modal.classList.remove('hidden');
            backdrop.classList.remove('hidden');
            
            // Set Loading
            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            contentWrapper.classList.add('hidden');
            document.getElementById('compareCountLabel').textContent = propertyIds.length;

            window.apiClient('/api/v1/properties/compare/', {
                method: 'POST',
                body: JSON.stringify({ property_ids: propertyIds })
            })
            .then(data => {
                loadingState.classList.add('hidden');
                if (data.error) {
                    showCompareError(data.error);
                } else {
                    renderComparisonMatrix(data.results);
                }
            })
            .catch(err => {
                loadingState.classList.add('hidden');
                showCompareError(err.message || 'An unexpected error occurred while fetching properties.');
            });
        };

        window.closeCompareModal = function() {
            modal.classList.add('hidden');
            backdrop.classList.add('hidden');
        };

        if (closeBtn) closeBtn.addEventListener('click', window.closeCompareModal);
        if (backdrop) backdrop.addEventListener('click', window.closeCompareModal);

        function showCompareError(msg) {
            errorState.classList.remove('hidden');
            document.getElementById('compareErrorText').textContent = msg;
        }

        function renderComparisonMatrix(properties) {
            contentWrapper.classList.remove('hidden');
            const thead = document.getElementById('compareTableRowHeaders');
            const tbody = document.getElementById('compareTableBody');
            
            // Render Headers (Images and basic info)
            let headersHtml = '<th class="w-48 p-4 font-bold text-slate-400 text-xs uppercase tracking-wider align-bottom">Specs</th>';
            properties.forEach(p => {
                const imgUrl = (p.images && p.images.length > 0) ? p.images[0].image : '/static/img/placeholder.jpg';
                headersHtml += `
                    <th class="p-4 align-top w-1/4 min-w-[200px]">
                        <div class="relative w-full h-32 rounded-xl bg-slate-100 dark:bg-slate-800 overflow-hidden mb-3">
                            <img src="${imgUrl}" class="w-full h-full object-cover" alt="Property">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                            <div class="absolute bottom-2 left-2 text-white">
                                <span class="text-[9px] font-black uppercase tracking-wider bg-emerald-500/80 px-1.5 py-0.5 rounded">${p.property_type}</span>
                            </div>
                        </div>
                        <h4 class="text-sm font-bold text-slate-900 dark:text-white leading-tight mb-1">${p.title}</h4>
                        <button onclick="window.closeCompareModal(); window.openAssetDrawer(${p.id});" class="text-xs font-bold text-emerald-600 hover:underline">View Asset &rarr;</button>
                    </th>
                `;
            });
            thead.innerHTML = headersHtml;

            // Define Metrics to compare
            const metrics = [
                { label: 'Price', key: 'price', format: val => formatPrice(val), isBetter: (a, b) => a < b }, // lower is better
                { label: 'Area (sqft)', key: 'area_sqft', format: val => val.toLocaleString(), isBetter: (a, b) => a > b },
                { label: 'Price / sqft', key: 'price_sqft', format: val => '₹' + val.toLocaleString(), isBetter: (a, b) => a < b },
                { label: 'Bedrooms', key: 'bedrooms', format: val => val, isBetter: (a, b) => a > b },
                { label: 'Location Score', key: 'location_score', format: val => (val.overall_score || 0).toFixed(1) + '/100', isBetter: (a, b) => a > b },
            ];

            let bodyHtml = '';
            metrics.forEach(metric => {
                bodyHtml += '<tr>';
                bodyHtml += `<td class="p-4 text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-50/50 dark:bg-slate-900/50">${metric.label}</td>`;
                
                // Find the best value to highlight
                let bestVal = null;
                properties.forEach(p => {
                    let val = getNestedValue(p, metric.key);
                    if (val !== undefined && val !== null) {
                        if (metric.key === 'location_score') val = val.overall_score || 0;
                        else val = parseFloat(val);

                        if (bestVal === null || metric.isBetter(val, bestVal)) {
                            bestVal = val;
                        }
                    }
                });

                properties.forEach(p => {
                    let rawVal = getNestedValue(p, metric.key);
                    let displayVal = 'N/A';
                    let isBest = false;
                    
                    if (rawVal !== undefined && rawVal !== null) {
                        let compVal = rawVal;
                        if (metric.key === 'location_score') compVal = rawVal.overall_score || 0;
                        else compVal = parseFloat(rawVal);
                        
                        displayVal = metric.format(compVal);
                        if (compVal === bestVal && compVal !== 0) {
                            isBest = true;
                        }
                    }
                    
                    const highlightClass = isBest ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-800 dark:text-emerald-400 font-extrabold ring-1 ring-emerald-500/20' : 'text-slate-700 dark:text-slate-300 font-medium';
                    
                    bodyHtml += `
                        <td class="p-4 align-middle">
                            <div class="px-3 py-2 rounded-xl text-sm ${highlightClass} transition-colors inline-block w-full text-center">
                                ${displayVal}
                            </div>
                        </td>
                    `;
                });
                bodyHtml += '</tr>';
            });

            // Amenity Breakdown Rows (from location score)
            const amenityMetrics = [
                { label: 'Transport', key: 'location_score.components.Transport.nearest.distance_meters', isBetter: (a, b) => a < b },
                { label: 'Healthcare', key: 'location_score.components.Healthcare.nearest.distance_meters', isBetter: (a, b) => a < b },
                { label: 'Education', key: 'location_score.components.Education.nearest.distance_meters', isBetter: (a, b) => a < b },
            ];

            bodyHtml += '<tr><td colspan="5" class="p-4 pt-8 pb-2 text-[10px] font-black uppercase text-slate-400 tracking-widest border-t-0">Proximity Metrics (Distance to Nearest)</td></tr>';

            amenityMetrics.forEach(metric => {
                bodyHtml += '<tr>';
                bodyHtml += `<td class="p-4 text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-50/50 dark:bg-slate-900/50">${metric.label}</td>`;
                
                let bestVal = null;
                properties.forEach(p => {
                    let val = getNestedValue(p, metric.key);
                    if (val !== undefined && val !== null) {
                        if (bestVal === null || metric.isBetter(val, bestVal)) bestVal = val;
                    }
                });

                properties.forEach(p => {
                    let rawVal = getNestedValue(p, metric.key);
                    let displayVal = '-';
                    let isBest = false;
                    
                    if (rawVal !== undefined && rawVal !== null) {
                        displayVal = rawVal < 1000 ? `${Math.round(rawVal)}m` : `${(rawVal/1000).toFixed(1)}km`;
                        if (rawVal === bestVal) isBest = true;
                    }
                    
                    const highlightClass = isBest ? 'text-emerald-600 dark:text-emerald-400 font-extrabold' : 'text-slate-600 dark:text-slate-400 font-semibold';
                    
                    bodyHtml += `<td class="p-4 align-middle text-center text-xs ${highlightClass}">${displayVal}</td>`;
                });
                bodyHtml += '</tr>';
            });

            tbody.innerHTML = bodyHtml;
        }

        function formatPrice(priceNum) {
            if (!priceNum) return 'N/A';
            let formattedPrice = '₹' + priceNum.toLocaleString('en-IN');
            if (priceNum >= 10000000) {
                formattedPrice = `₹${(priceNum / 10000000).toFixed(2)} Cr`;
            } else if (priceNum >= 100000) {
                formattedPrice = `₹${(priceNum / 100000).toFixed(2)} L`;
            }
            return formattedPrice;
        }

        function getNestedValue(obj, path) {
            return path.split('.').reduce((acc, part) => acc && acc[part], obj);
        }
    });
</script>
