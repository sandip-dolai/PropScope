<!-- Enterprise Navigation Header -->
<header class="border-b border-slate-200/90 dark:border-slate-800/80 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md sticky top-0 z-50 transition-colors shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Platform Brand Identity -->
            <div class="flex items-center space-x-3.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 via-emerald-500 to-teal-400 flex items-center justify-center font-black text-white text-base shadow-md shadow-emerald-500/20">
                    PS
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <a href="{% url 'home' %}" class="font-extrabold text-lg tracking-tight text-slate-900 dark:text-white hover:opacity-95 transition">PropScope</a>
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">
                            PostGIS 3.4
                        </span>
                    </div>
                    <p class="text-[11px] font-medium text-slate-500 dark:text-slate-400 leading-none mt-0.5">Geospatial Real Estate Intelligence</p>
                </div>
            </div>

            <!-- Navigation Modules -->
            <nav class="hidden lg:flex items-center space-x-7 text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">
                <a href="{% url 'home' %}" class="hover:text-emerald-600 dark:hover:text-emerald-400 transition flex items-center space-x-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span>Market Discovery</span>
                </a>
                <a href="/api/v1/areas/" target="_blank" class="hover:text-emerald-600 dark:hover:text-emerald-400 transition">
                    Sub-Markets
                </a>
                <a href="/api/v1/amenities/" target="_blank" class="hover:text-emerald-600 dark:hover:text-emerald-400 transition">
                    Infrastructure
                </a>
                <a href="/api/docs/swagger/" target="_blank" class="hover:text-emerald-600 dark:hover:text-emerald-400 transition flex items-center space-x-1">
                    <span>Spatial API Docs</span>
                    <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </nav>

            <!-- Header Actions -->
            <div class="flex items-center space-x-3">
                <!-- Light / Dark Theme Switcher Button -->
                <button id="themeToggleBtn" type="button" aria-label="Toggle theme" title="Toggle Theme"
                        class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition shadow-sm border border-slate-200/80 dark:border-slate-700/60">
                    <!-- Sun Icon (Shown in Dark Mode) -->
                    <svg id="themeIconSun" class="w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <!-- Moon Icon (Shown in Light Mode) -->
                    <svg id="themeIconMoon" class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>

                <!-- Dynamic Auth / Persona Section (Populated or linked) -->
                <div id="authNavContainer" class="flex items-center space-x-2">
                    <button id="openAuthModalBtn" type="button"
                            class="px-3.5 py-2 text-xs font-bold rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 dark:bg-emerald-500/10 dark:hover:bg-emerald-500/20 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30 transition shadow-sm flex items-center space-x-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                        <span>Sign In</span>
                    </button>
                </div>

                <!-- Agent / Admin Console Button -->
                <a href="/admin/" target="_blank"
                   class="hidden sm:flex px-3.5 py-2 text-xs font-bold rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-emerald-600 dark:hover:bg-emerald-500 dark:text-slate-950 transition shadow-sm items-center space-x-1.5 border border-slate-800 dark:border-emerald-500">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span>Agent Console</span>
                </a>
            </div>
        </div>
    </div>
</header>
