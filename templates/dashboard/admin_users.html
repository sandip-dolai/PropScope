{% extends 'layouts/admin_base.html' %}

{% block admin_content %}
<div class="space-y-4">
    <h2 class="text-xl font-black text-slate-800 dark:text-white">User Management</h2>
    
    <!-- Action and Filter Bar -->
    <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
        
        <!-- Bulk Actions (Django Admin style) -->
        <div class="flex items-center space-x-2 w-full md:w-auto">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Action:</label>
            <select id="bulkActionSelect" class="pl-3 pr-8 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 transition">
                <option value="">---------</option>
                <option value="activate">Activate Selected Users</option>
                <option value="suspend">Suspend Selected Users</option>
                <option value="delete">Delete Selected Users</option>
            </select>
            <button onclick="window.executeBulkAction()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition shadow-sm">Go</button>
        </div>

        <div class="flex items-center space-x-3 w-full md:w-auto">
            <!-- Filter Dropdown -->
            <select id="roleFilterSelect" class="pl-3 pr-8 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 transition">
                <option value="">All Roles</option>
                <option value="BUYER">Buyer</option>
                <option value="AGENT">Agent</option>
                <option value="ADMIN">Admin</option>
            </select>
            <!-- Search -->
            <div class="relative flex-grow sm:w-64">
                <input type="text" id="userSearchInput" placeholder="Search user..."
                       class="w-full pl-9 pr-4 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition">
                <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/90 dark:border-slate-800 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 dark:bg-slate-950/60 border-b border-slate-200/80 dark:border-slate-800 text-[11px] font-extrabold uppercase tracking-wider text-slate-400">
                    <tr>
                        <th class="px-5 py-4 w-12">
                            <input type="checkbox" id="selectAllUsers" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                        </th>
                        <th class="px-5 py-4">User</th>
                        <th class="px-5 py-4">Role</th>
                        <th class="px-5 py-4">Status</th>
                        <th class="px-5 py-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody" class="divide-y divide-slate-100 dark:divide-slate-800/80">
                    <tr><td colspan="5" class="px-5 py-8 text-center text-slate-400">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
        <!-- Pagination Placeholder -->
        <div class="px-5 py-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 flex items-center justify-between">
            <div class="text-xs text-slate-500 font-semibold" id="paginationInfo">Showing 0 users</div>
            <div class="flex items-center space-x-2" id="paginationControls"></div>
        </div>
    </div>
</div>

<!-- Edit User Modal -->
<div id="userModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <h3 id="userModalTitle" class="font-bold text-slate-900 dark:text-white">Edit User</h3>
            <button onclick="window.closeUserModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form id="userForm" onsubmit="window.saveUser(event)">
            <input type="hidden" id="editUserId">
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">First Name</label>
                        <input type="text" id="editFirstName" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Last Name</label>
                        <input type="text" id="editLastName" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Username</label>
                    <input type="text" id="editUsername" required class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email</label>
                    <input type="email" id="editEmail" required class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Role</label>
                    <select id="editRole" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 transition">
                        <option value="BUYER">Buyer</option>
                        <option value="AGENT">Agent</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="editIsActive" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Account is Active</label>
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-800 flex justify-end space-x-2">
                <button type="button" onclick="window.closeUserModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition">Cancel</button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition shadow-sm">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block admin_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    let currentPage = 1;
    let totalPages = 1;
    const pageSize = 10;

    async function loadUsers(page = 1) {
        const tbody = document.getElementById('userTableBody');
        if(!tbody) return;
        
        currentPage = page;
        const query = document.getElementById('userSearchInput').value.trim();
        const role = document.getElementById('roleFilterSelect').value;
        
        try {
            let url = `/api/v1/properties/admin/moderation/users/?page=${page}`;
            if (query) url += `&search=${encodeURIComponent(query)}`;
            if (role) url += `&role=${role}`;
            
            const res = await window.apiClient(url);
            
            // Uncheck the 'select all' box whenever we load a page
            document.getElementById('selectAllUsers').checked = false;
            
            if (!res.results || res.results.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-5 py-8 text-center text-slate-400">No users found.</td></tr>`;
                document.getElementById('paginationInfo').textContent = 'Showing 0 users';
                document.getElementById('paginationControls').innerHTML = '';
                return;
            }

            // Update pagination UI
            const totalCount = res.count || res.results.length;
            totalPages = Math.ceil(totalCount / pageSize) || 1;
            document.getElementById('paginationInfo').textContent = `Showing ${(page-1)*pageSize + 1} to ${Math.min(page*pageSize, totalCount)} of ${totalCount} users`;
            
            let pgHtml = '';
            if (page > 1) {
                pgHtml += `<button onclick="window.changeUserPage(${page-1})" class="px-2 py-1 text-xs font-bold text-slate-600 bg-white border border-slate-200 rounded-lg shadow-sm hover:bg-slate-50 transition">Prev</button>`;
            }
            if (page < totalPages) {
                pgHtml += `<button onclick="window.changeUserPage(${page+1})" class="px-2 py-1 text-xs font-bold text-slate-600 bg-white border border-slate-200 rounded-lg shadow-sm hover:bg-slate-50 transition">Next</button>`;
            }
            document.getElementById('paginationControls').innerHTML = pgHtml;

            tbody.innerHTML = res.results.map(u => {
                const statusBadge = u.is_active ? 
                    `<span class="px-2 py-0.5 rounded text-[10px] font-black bg-emerald-500/10 text-emerald-600 border border-emerald-500/20">Active</span>` :
                    `<span class="px-2 py-0.5 rounded text-[10px] font-black bg-rose-500/10 text-rose-600 border border-rose-500/20">Suspended</span>`;
                
                // Keep the original toggle logic but switch class based on status
                const toggleText = u.is_active ? 'Suspend' : 'Activate';
                const toggleClass = u.is_active ? 'bg-rose-100 text-rose-600 hover:bg-rose-200' : 'bg-emerald-100 text-emerald-600 hover:bg-emerald-200';

                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                        <td class="px-5 py-4 w-12">
                            <input type="checkbox" value="${u.id}" class="user-row-checkbox rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                        </td>
                        <td class="px-5 py-4">
                            <div class="font-bold text-xs text-slate-900 dark:text-white">${u.username}</div>
                            <div class="text-[10px] text-slate-500">${u.email}</div>
                            ${u.first_name || u.last_name ? `<div class="text-[10px] text-slate-400 mt-0.5">${u.first_name} ${u.last_name}</div>` : ''}
                        </td>
                        <td class="px-5 py-4 text-xs font-semibold text-slate-700 dark:text-slate-300">${u.role_display}</td>
                        <td class="px-5 py-4 text-xs">${statusBadge}</td>
                        <td class="px-5 py-4 text-right">
                            <div class="flex items-center justify-end space-x-2">
                                <button onclick="window.openUserModal(${u.id}, '${u.username}', '${u.email}', '${u.first_name || ''}', '${u.last_name || ''}', '${u.role}', ${u.is_active})" 
                                        class="px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-100 text-xs font-bold transition">Edit</button>
                                <button onclick="window.toggleUserStatus(${u.id}, ${u.is_active})" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${toggleClass}">${toggleText}</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="5" class="px-5 py-8 text-center text-rose-500 font-bold text-xs">Error loading users.</td></tr>`;
        }
    }

    // Pagination helper
    window.changeUserPage = function(page) {
        loadUsers(page);
    };

    // Toggle single user
    window.toggleUserStatus = async function(userId, currentStatus) {
        try {
            const res = await window.apiClient(`/api/v1/properties/admin/moderation/users/${userId}/`, {
                method: 'PUT',
                body: JSON.stringify({ is_active: !currentStatus })
            });
            window.showAdminToast(res.message, true);
            loadUsers(currentPage);
        } catch (err) {
            window.showAdminToast(err.message || 'Failed to change user status.', false);
        }
    };

    // Checkbox selection logic
    document.getElementById('selectAllUsers').addEventListener('change', function(e) {
        document.querySelectorAll('.user-row-checkbox').forEach(cb => {
            cb.checked = e.target.checked;
        });
    });

    // Bulk Actions
    window.executeBulkAction = async function() {
        const action = document.getElementById('bulkActionSelect').value;
        if (!action) {
            window.showAdminToast('Please select an action to perform.', false);
            return;
        }

        const selectedIds = Array.from(document.querySelectorAll('.user-row-checkbox:checked')).map(cb => cb.value);
        if (selectedIds.length === 0) {
            window.showAdminToast('No users selected.', false);
            return;
        }

        if (!confirm(`Are you sure you want to perform '${action}' on ${selectedIds.length} users?`)) return;

        try {
            const res = await window.apiClient(`/api/v1/properties/admin/moderation/users/bulk-action/`, {
                method: 'POST',
                body: JSON.stringify({ action: action, user_ids: selectedIds })
            });
            window.showAdminToast(res.message || `Bulk action '${action}' completed successfully.`, true);
            loadUsers(currentPage);
            document.getElementById('bulkActionSelect').value = '';
        } catch (err) {
            window.showAdminToast(err.message || 'Bulk action failed.', false);
        }
    };

    // Edit Modal Logic
    window.openUserModal = function(id, username, email, firstName, lastName, role, isActive) {
        document.getElementById('editUserId').value = id;
        document.getElementById('editUsername').value = username;
        document.getElementById('editEmail').value = email;
        document.getElementById('editFirstName').value = firstName;
        document.getElementById('editLastName').value = lastName;
        document.getElementById('editRole').value = role;
        document.getElementById('editIsActive').checked = isActive;
        
        document.getElementById('userModal').classList.remove('hidden');
    };

    window.closeUserModal = function() {
        document.getElementById('userModal').classList.add('hidden');
        document.getElementById('userForm').reset();
    };

    window.saveUser = async function(e) {
        e.preventDefault();
        const id = document.getElementById('editUserId').value;
        const data = {
            username: document.getElementById('editUsername').value,
            email: document.getElementById('editEmail').value,
            first_name: document.getElementById('editFirstName').value,
            last_name: document.getElementById('editLastName').value,
            role: document.getElementById('editRole').value,
            is_active: document.getElementById('editIsActive').checked
        };

        try {
            const res = await window.apiClient(`/api/v1/properties/admin/moderation/users/${id}/`, {
                method: 'PUT',
                body: JSON.stringify(data)
            });
            window.showAdminToast(res.message || 'User updated successfully.', true);
            window.closeUserModal();
            loadUsers(currentPage);
        } catch (err) {
            window.showAdminToast(err.message || 'Failed to save user.', false);
        }
    };

    // Filter listeners
    document.getElementById('roleFilterSelect').addEventListener('change', () => loadUsers(1));

    let debounceTimer;
    document.getElementById('userSearchInput').addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => loadUsers(1), 300);
    });

    // Init
    loadUsers(1);
});
</script>
{% endblock %}
